aid: bluestacks
name: Bluestacks
description: 'BlueStacks is the Android app player and mobile-cloud gaming platform operated by now.gg,
  Inc. (Campbell, California). The consumer product runs Android apps and games on Windows and macOS,
  while the now.gg mobile cloud streams the same titles in a browser. The developer-facing surface is
  published at docs.now.gg and is built around nowStudio (the publisher console) and nowSDK (Unity and
  native Android modules for Payments, User Account Service, Rewarded Ads, Events and Utility). Two server-side
  REST surfaces are documented publicly: a User Account Service OAuth 2.0 API on now.gg for token generation,
  token verification, user info and session info, and a Payments API on payments-api.now.gg for server-side
  purchase verification, consumption and subscription acknowledgement. now.gg also calls developer-hosted
  webhooks for subscription and webshop order events, ships an official nowgg CLI on PyPI for uploading
  app builds, and publishes an embeddable JavaScript module for running cloud games in an iframe. BlueStacks
  AI is a separate, newer product line that packages a sandboxed local runtime for AI agents.'
