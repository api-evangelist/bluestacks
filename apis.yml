- name: now.gg Payments Server API
  description: Server-to-server in-app purchase API for publishers using now.gg Payments. Backends verify
    a purchase token (verifyPurchase), mark a consumable as consumed (consumePurchase) and acknowledge
    a subscription purchase (acknowledgePurchase). Authorization is a Payments API Key issued in nowStudio,
    sent in the Authorization header with application/x-www-form-urlencoded bodies. The v1 verifyPayment
    endpoint on payments.now.gg is deprecated in favour of v2 verifyPurchase.
  humanURL: https://docs.now.gg/payments/references
  baseURL: https://payments-api.now.gg
